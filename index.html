<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Tacho PRO</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">

<style>
body { background:#111; color:white; font-family:Arial; text-align:center; }
h1 { margin-top:20px; }
.big { font-size:50px; margin:15px; }
.medium { font-size:22px; margin:8px; }

button {
  padding:15px 25px;
  margin:10px;
  font-size:18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.drive { background:green; }
.break { background:blue; }
.work { background:orange; }
.rest { background:red; }

.reset {
  background:black;
  border:2px solid white;
  color:white;
}

#summary { margin-top:20px; font-size:18px; }

.daily-work {
  margin-top:10px;
  font-weight:bold;
  font-size:22px;
  color:#00ffcc;
}
</style>
</head>

<body>

<h1>TACHO PRO</h1>
<div style="color:red;font-weight:bold;">PRACA DZIENNA</div>

<div id="current" class="medium"></div>

<div class="big" id="sessionTimer">00:00:00</div>

<div class="medium">Ciągła jazda:</div>
<div class="medium" id="driveContinuous">00:00:00</div>

<div class="medium">Ciągła przerwa:</div>
<div class="medium" id="breakContinuous">00:00:00</div>

<h3>Podsumowanie dnia:</h3>
<div id="summary"></div>

<div class="daily-work">
PRACA DZIENNA: <span id="dailyWork">0 min</span>
</div>

<button class="drive" onclick="start('Jazda')">Jazda</button>
<button class="break" onclick="start('Przerwa')">Przerwa</button>
<button class="work" onclick="start('Inna praca')">Inna praca</button>
<button class="rest" onclick="start('Odpoczynek')">Odpoczynek</button>
<br>
<button class="reset" onclick="resetAll()">RESET</button>

<script>

// === ODCZYT Z PAMIĘCI ===
let state = JSON.parse(localStorage.getItem("tachoState")) || {
  currentActivity: "Odpoczynek",
  activityStart: null,
  totals: {
    "Jazda": 0,
    "Przerwa": 0,
    "Inna praca": 0,
    "Odpoczynek": 0
  },
  driveContinuous: 0,
  breakContinuous: 0
};

function saveState() {
  localStorage.setItem("tachoState", JSON.stringify(state));
}

function start(activity) {

  updateTotals(); // najpierw zapisujemy poprzedni czas

  state.currentActivity = activity;
  state.activityStart = Date.now();

  saveState();
  render();
}

function updateTotals() {

  if(!state.activityStart) return;

  let diff = Math.floor((Date.now() - state.activityStart)/1000);

  state.totals[state.currentActivity] += diff;

  if(state.currentActivity === "Jazda") {
    state.driveContinuous += diff;
  }

  if(state.currentActivity === "Przerwa") {
    state.breakContinuous += diff;
  }

  state.activityStart = Date.now();
}

function format(sec){
  let h = String(Math.floor(sec/3600)).padStart(2,'0');
  let m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
  let s = String(sec%60).padStart(2,'0');
  return h+":"+m+":"+s;
}

function render(){

  let session = 0;
  if(state.activityStart){
    session = Math.floor((Date.now()-state.activityStart)/1000);
  }

  document.getElementById("current").innerText = state.currentActivity;
  document.getElementById("sessionTimer").innerText = format(session);
  document.getElementById("driveContinuous").innerText = format(state.driveContinuous);
  document.getElementById("breakContinuous").innerText = format(state.breakContinuous);

  let text="";
  let daily=0;

  for(let key in state.totals){
    let value = state.totals[key];
    if(key===state.currentActivity){
      value += session;
    }
    text += key + ": " + Math.floor(value/60) + " min<br>";

    if(key==="Jazda"||key==="Inna praca"){
      daily += value;
    }
  }

  document.getElementById("summary").innerHTML=text;
  document.getElementById("dailyWork").innerText=Math.floor(daily/60)+" min";
}

function resetAll(){
  if(confirm("Zresetować wszystko?")){
    localStorage.removeItem("tachoState");
    location.reload();
  }
}

setInterval(()=>{
  updateTotals();
  saveState();
  render();
},1000);

render();

</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
